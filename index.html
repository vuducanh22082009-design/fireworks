<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháo Hoa Năm Mới 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        /* Background gradient */
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(to bottom, #0a0a2e 0%, #1a1a3e 50%, #0a0a2e 100%);
            z-index: 1;
        }

        /* Canvas cho pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* Text effect */
        .text-effect {
            position: fixed;
            font-size: 6px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: scale(0.05);
            pointer-events: none;
            z-index: 3;
        }

        /* PIN Overlay */
        #pinOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        #pinOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pin-question {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .pin-container {
            display: flex;
            gap: 15px;
        }

        .pin-input {
            width: 60px;
            height: 80px;
            font-size: 36px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .pin-input:focus {
            border-color: rgba(255, 223, 0, 0.8);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.5);
            transform: scale(1.1);
        }

        .pin-error {
            color: #ff6b6b;
            font-size: 16px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .pin-error.show {
            opacity: 1;
        }

        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Credit text */
        #creditText {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 6px;
            z-index: 3;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div id="background"></div>

    <!-- Canvas pháo hoa -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Credit text -->
    <div id="creditText">code by Đức Anh</div>

    <!-- PIN Overlay -->
    <div id="pinOverlay">
        <div class="pin-question">ĐÂY LÀ NĂM BAO NHIỀU?</div>
        <div class="pin-container">
            <input type="text" class="pin-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="pin-error" id="pinError">Sai mã PIN! Thử lại nhé 🎆</div>
    </div>

    <!-- Audio files -->
    <audio id="backgroundMusic" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>
    <audio id="additionalMusic" loop>
        <source src="music.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ===== CANVAS SETUP =====
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ===== AUDIO SETUP =====
        const audio = document.getElementById('backgroundMusic');
        const audio2 = document.getElementById('additionalMusic');
        let isUnlocked = false;

        // ===== PIN VALIDATION =====
        const pinOverlay = document.getElementById('pinOverlay');
        const pinInputs = document.querySelectorAll('.pin-input');
        const pinError = document.getElementById('pinError');
        const correctPin = '2026';

        // Auto-focus first input
        pinInputs[0].focus();

        // Handle PIN input
        pinInputs.forEach((input, index) => {
            // Chỉ cho phép nhập số
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Chỉ giữ lại số
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Tự động chuyển sang ô tiếp theo
                if (value && index < 3) {
                    pinInputs[index + 1].focus();
                }

                // Kiểm tra khi nhập đủ 4 số
                if (index === 3 && value) {
                    checkPin();
                }
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            // Select all on focus
            input.addEventListener('focus', (e) => {
                e.target.select();
            });
        });

        function checkPin() {
            const enteredPin = Array.from(pinInputs).map(input => input.value).join('');
            
            if (enteredPin === correctPin) {
                // Đúng PIN - bắt đầu show
                pinError.classList.remove('show');
                setTimeout(() => {
                    pinOverlay.classList.add('hidden');
                    isUnlocked = true;
                    startFireworks();
                    // Tự động phát cả 2 file nhạc
                    audio.play().catch(err => console.log('Audio 1 play failed:', err));
                    audio2.play().catch(err => console.log('Audio 2 play failed:', err));
                }, 300);
            } else {
                // Sai PIN
                pinError.classList.add('show');
                // Reset inputs
                pinInputs.forEach(input => input.value = '');
                pinInputs[0].focus();
                // Shake effect
                pinOverlay.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    pinOverlay.style.animation = '';
                    pinError.classList.remove('show');
                }, 2000);
            }
        }

        // ===== PARTICLE CLASS (Hạt pháo hoa) =====
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.decay = Math.random() * 0.008 + 0.008;
                this.gravity = 0.03;
                this.friction = 0.99;
            }

            update() {
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                this.velocity.y += this.gravity;
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 1, 0, Math.PI * 2);
                ctx.fill();
                
                ctx.globalAlpha = this.alpha * 0.2;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ===== FIREWORK CLASS (Quả pháo) =====
        class Firework {
            constructor(x, targetY) {
                this.x = x;
                this.y = canvas.height;
                this.targetY = targetY;
                this.velocity = {
                    x: (Math.random() - 0.5) * 1.5,
                    y: -Math.random() * 4 - 6
                };
                this.exploded = false;
                this.particles = [];
                this.trail = [];
                this.hue = Math.random() * 360;
                this.shapes = ['circle', 'heart', '2026', 'LOVE'];
                this.shape = this.shapes[Math.floor(Math.random() * this.shapes.length)];
            }

            update() {
                if (!this.exploded) {
                    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                    if (this.trail.length > 10) this.trail.shift();
                    
                    this.velocity.y += 0.08;
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    
                    if (this.y <= this.targetY || this.velocity.y >= 0) {
                        this.explode();
                    }
                } else {
                    this.particles.forEach((particle, index) => {
                        particle.update();
                        if (particle.alpha <= 0) {
                            this.particles.splice(index, 1);
                        }
                    });
                }
                
                this.trail.forEach(t => t.alpha -= 0.1);
            }

            createHeartPattern() {
                const points = [];
                const size = 50;
                for (let t = 0; t < Math.PI * 2; t += 0.1) {
                    const x = size * 16 * Math.pow(Math.sin(t), 3);
                    const y = -size * (13 * Math.cos(t) - 5 * Math.cos(2*t) - 2 * Math.cos(3*t) - Math.cos(4*t));
                    points.push({ x: x / 10, y: y / 10 });
                }
                return points;
            }

            create2026Pattern() {
                const points = [];
                const scale = 3;
                const patterns = {
                    '2': [[-2,4],[-1,4],[0,4],[1,4],[1,3],[1,2],[0,1],[-1,1],[-2,0],[-2,-1],[-1,-2],[0,-2],[1,-2],[1,-3],[1,-4]],
                    '0': [[-1,4],[0,4],[1,4],[2,3],[2,2],[2,1],[2,0],[2,-1],[2,-2],[1,-3],[0,-3],[-1,-3],[-2,-2],[-2,-1],[-2,0],[-2,1],[-2,2],[-1,3]],
                    '2_2': [[3,4],[4,4],[5,4],[6,4],[6,3],[6,2],[5,1],[4,1],[3,0],[3,-1],[4,-2],[5,-2],[6,-2],[6,-3],[6,-4]],
                    '6': [[8,4],[9,4],[10,4],[11,3],[11,2],[10,1],[9,1],[8,1],[7,0],[7,-1],[7,-2],[8,-3],[9,-3],[10,-3],[11,-2],[11,-1],[10,0],[9,0]]
                };
                
                Object.values(patterns).forEach(pattern => {
                    pattern.forEach(([x, y]) => {
                        points.push({ x: x * scale, y: y * scale });
                    });
                });
                return points;
            }

            createLOVEPattern() {
                const points = [];
                const scale = 3.5;
                const patterns = {
                    'L': [[-3,3],[-3,2],[-3,1],[-3,0],[-3,-1],[-3,-2],[-3,-3],[-2,-3],[-1,-3]],
                    'O': [[0,3],[1,3],[2,2],[2,1],[2,0],[2,-1],[1,-2],[0,-2],[-1,-2],[-2,-1],[-2,0],[-2,1],[-2,2],[-1,3]],
                    'V': [[3,3],[4,2],[4,1],[5,0],[5,-1],[5,-2],[5,-3],[6,-2],[6,-1],[7,0],[7,1],[7,2],[8,3]],
                    'E': [[9,3],[10,3],[11,3],[9,2],[9,1],[9,0],[10,0],[11,0],[9,-1],[9,-2],[9,-3],[10,-3],[11,-3]]
                };
                
                Object.values(patterns).forEach(pattern => {
                    pattern.forEach(([x, y]) => {
                        points.push({ x: x * scale, y: y * scale });
                    });
                });
                return points;
            }

            explode() {
                this.exploded = true;
                let pattern = [];

                if (this.shape === 'heart') {
                    pattern = this.createHeartPattern();
                } else if (this.shape === '2026') {
                    pattern = this.create2026Pattern();
                } else if (this.shape === 'LOVE') {
                    pattern = this.createLOVEPattern();
                } else {
                    const particleCount = 100 + Math.random() * 100;
                    const angleStep = (Math.PI * 2) / particleCount;
                    for (let i = 0; i < particleCount; i++) {
                        const angle = angleStep * i;
                        const speed = Math.random() * 5 + 2;
                        pattern.push({ 
                            x: Math.cos(angle) * speed * 7.5, 
                            y: Math.sin(angle) * speed * 7.5 
                        });
                    }
                }

                pattern.forEach(point => {
                    const velocity = {
                        x: point.x / 20,
                        y: point.y / 20
                    };
                    
                    const hueVariation = this.hue + (Math.random() * 60 - 30);
                    const color = `hsl(${hueVariation}, 100%, ${60 + Math.random() * 20}%)`;
                    
                    this.particles.push(new Particle(this.x, this.y, color, velocity));
                });
            }

            draw() {
                if (!this.exploded) {
                    this.trail.forEach((point, index) => {
                        ctx.save();
                        ctx.globalAlpha = point.alpha;
                        ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                        const size = 3 * (index / this.trail.length);
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });
                    
                    ctx.save();
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    this.particles.forEach(particle => particle.draw());
                }
            }

            isDone() {
                return this.exploded && this.particles.length === 0;
            }
        }

        // ===== TEXT ANIMATION =====
        const texts = ['Happy New Year', '2026'];
        const textColors = [
            'rgba(255, 255, 255, 0.9)',
            'rgba(255, 223, 0, 0.9)',
            'rgba(255, 182, 193, 0.9)',
            'rgba(173, 216, 230, 0.9)'
        ];

        function createTextEffect() {
            const textEl = document.createElement('div');
            textEl.className = 'text-effect';
            textEl.textContent = texts[Math.floor(Math.random() * texts.length)];
            textEl.style.color = textColors[Math.floor(Math.random() * textColors.length)];
            
            const left = 15 + Math.random() * 70;
            const top = 20 + Math.random() * 60;
            textEl.style.left = left + '%';
            textEl.style.top = top + '%';
            
            document.body.appendChild(textEl);

            let scale = 0.05;
            let opacity = 0;
            const duration = 1650;
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                if (progress < 0.35) {
                    const zoomProgress = progress / 0.35;
                    scale = 0.05 + (2.0 - 0.05) * zoomProgress;
                    opacity = zoomProgress;
                } else {
                    scale = 2.0;
                    const fadeProgress = (progress - 0.35) / 0.65;
                    opacity = 1 - fadeProgress;
                }

                textEl.style.transform = `scale(${scale})`;
                textEl.style.opacity = opacity;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    textEl.remove();
                }
            }

            animate();
        }

        let textInterval;
        
        function startTextEffects() {
            textInterval = setInterval(() => {
                const count = Math.random() > 0.3 ? 3 : 2;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => createTextEffect(), i * 100);
                }
            }, 450);
        }

        // ===== MAIN ANIMATION LOOP =====
        const fireworks = [];
        let animationStarted = false;

        function startFireworks() {
            if (!animationStarted) {
                animationStarted = true;
                startTextEffects();
            }
        }

        function animate() {
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            if (isUnlocked && Math.random() < 0.08) {
                const x = Math.random() * canvas.width;
                const targetY = canvas.height * 0.1 + Math.random() * canvas.height * 0.25;
                fireworks.push(new Firework(x, targetY));
            }

            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw();
                
                if (firework.isDone()) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        // ===== RESIZE HANDLER =====
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start animation
        animate();
    </script>
</body>
</html>
