<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pháo Hoa Năm Mới 2026</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            overflow: hidden;
            background: #000;
            font-family: 'Arial', sans-serif;
        }

        /* Background image */
        #background {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0a0a2e;
            background-image: url('./background.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
            filter: brightness(0.7);
            z-index: 1;
        }

        /* Canvas cho pháo hoa */
        #fireworksCanvas {
            position: fixed;
            top: 0;
            left: 0;
            z-index: 2;
        }

        /* Text effect */
        .text-effect {
            position: fixed;
            font-size: 6px;
            font-weight: bold;
            white-space: nowrap;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.8),
                         0 0 20px rgba(255, 255, 255, 0.5);
            opacity: 0;
            transform: scale(0.05);
            pointer-events: none;
            z-index: 3;
        }

        /* PIN Overlay */
        #pinOverlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.95);
            z-index: 1000;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            transition: opacity 0.5s;
        }

        #pinOverlay.hidden {
            opacity: 0;
            pointer-events: none;
        }

        .pin-question {
            color: white;
            font-size: 28px;
            font-weight: bold;
            margin-bottom: 40px;
            text-align: center;
            letter-spacing: 2px;
            text-shadow: 0 0 20px rgba(255, 255, 255, 0.5);
        }

        .pin-container {
            display: flex;
            gap: 15px;
        }

        .pin-input {
            width: 60px;
            height: 80px;
            font-size: 36px;
            text-align: center;
            border: 3px solid rgba(255, 255, 255, 0.3);
            border-radius: 12px;
            background: rgba(255, 255, 255, 0.1);
            color: white;
            font-weight: bold;
            outline: none;
            transition: all 0.3s;
            backdrop-filter: blur(10px);
        }

        .pin-input:focus {
            border-color: rgba(255, 223, 0, 0.8);
            background: rgba(255, 255, 255, 0.2);
            box-shadow: 0 0 20px rgba(255, 223, 0, 0.5);
            transform: scale(1.1);
        }

        .pin-error {
            color: #ff6b6b;
            font-size: 16px;
            margin-top: 20px;
            opacity: 0;
            transition: opacity 0.3s;
        }

        .pin-error.show {
            opacity: 1;
        }

        /* Shake animation */
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-10px); }
            75% { transform: translateX(10px); }
        }

        /* Credit text */
        #creditText {
            position: fixed;
            bottom: 15px;
            left: 50%;
            transform: translateX(-50%);
            color: rgba(255, 255, 255, 0.6);
            font-size: 6px;
            z-index: 3;
            text-align: center;
            letter-spacing: 0.5px;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.8);
            pointer-events: none;
        }
    </style>
</head>
<body>
    <!-- Background -->
    <div id="background"></div>

    <!-- Canvas pháo hoa -->
    <canvas id="fireworksCanvas"></canvas>

    <!-- Credit text -->
    <div id="creditText">code by Đức Anh</div>

    <!-- PIN Overlay -->
    <div id="pinOverlay">
        <div class="pin-question">ĐÂY LÀ NĂM BAO NHIỀU?</div>
        <div class="pin-container">
            <input type="text" class="pin-input" maxlength="1" data-index="0" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="1" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="2" inputmode="numeric" pattern="[0-9]*">
            <input type="text" class="pin-input" maxlength="1" data-index="3" inputmode="numeric" pattern="[0-9]*">
        </div>
        <div class="pin-error" id="pinError">Sai mã PIN! Thử lại nhé 🎆</div>
    </div>

    <!-- Audio -->
    <audio id="backgroundMusic" loop>
        <source src="nhac.mp3" type="audio/mpeg">
    </audio>

    <script>
        // ===== CANVAS SETUP =====
        const canvas = document.getElementById('fireworksCanvas');
        const ctx = canvas.getContext('2d');
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;

        // ===== AUDIO SETUP =====
        const audio = document.getElementById('backgroundMusic');
        let isUnlocked = false;

        // ===== PIN VALIDATION =====
        const pinOverlay = document.getElementById('pinOverlay');
        const pinInputs = document.querySelectorAll('.pin-input');
        const pinError = document.getElementById('pinError');
        const correctPin = '2026';

        // Auto-focus first input
        pinInputs[0].focus();

        // Handle PIN input
        pinInputs.forEach((input, index) => {
            // Chỉ cho phép nhập số
            input.addEventListener('input', (e) => {
                const value = e.target.value;
                
                // Chỉ giữ lại số
                if (!/^\d*$/.test(value)) {
                    e.target.value = '';
                    return;
                }

                // Tự động chuyển sang ô tiếp theo
                if (value && index < 3) {
                    pinInputs[index + 1].focus();
                }

                // Kiểm tra khi nhập đủ 4 số
                if (index === 3 && value) {
                    checkPin();
                }
            });

            // Handle backspace
            input.addEventListener('keydown', (e) => {
                if (e.key === 'Backspace' && !e.target.value && index > 0) {
                    pinInputs[index - 1].focus();
                }
            });

            // Select all on focus
            input.addEventListener('focus', (e) => {
                e.target.select();
            });
        });

        function checkPin() {
            const enteredPin = Array.from(pinInputs).map(input => input.value).join('');
            
            if (enteredPin === correctPin) {
                // Đúng PIN - bắt đầu show
                pinError.classList.remove('show');
                setTimeout(() => {
                    pinOverlay.classList.add('hidden');
                    isUnlocked = true;
                    startFireworks();
                    // Tự động phát nhạc
                    audio.play().catch(err => console.log('Audio play failed:', err));
                }, 300);
            } else {
                // Sai PIN
                pinError.classList.add('show');
                // Reset inputs
                pinInputs.forEach(input => input.value = '');
                pinInputs[0].focus();
                // Shake effect
                pinOverlay.style.animation = 'shake 0.5s';
                setTimeout(() => {
                    pinOverlay.style.animation = '';
                    pinError.classList.remove('show');
                }, 2000);
            }
        }

        // ===== PARTICLE CLASS (Hạt pháo hoa) =====
        class Particle {
            constructor(x, y, color, velocity) {
                this.x = x;
                this.y = y;
                this.color = color;
                this.velocity = velocity;
                this.alpha = 1;
                this.decay = Math.random() * 0.015 + 0.015; // Tốc độ mờ dần
                this.gravity = 0.05; // Trọng lực
                this.friction = 0.98; // Ma sát không khí
            }

            update() {
                // Áp dụng ma sát
                this.velocity.x *= this.friction;
                this.velocity.y *= this.friction;
                
                // Áp dụng trọng lực
                this.velocity.y += this.gravity;
                
                // Cập nhật vị trí
                this.x += this.velocity.x;
                this.y += this.velocity.y;
                
                // Giảm độ sáng
                this.alpha -= this.decay;
            }

            draw() {
                ctx.save();
                ctx.globalAlpha = this.alpha;
                ctx.fillStyle = this.color;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 2, 0, Math.PI * 2);
                ctx.fill();
                
                // Thêm hào quang
                ctx.globalAlpha = this.alpha * 0.3;
                ctx.beginPath();
                ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                ctx.fill();
                ctx.restore();
            }
        }

        // ===== FIREWORK CLASS (Quả pháo) =====
        class Firework {
            constructor(x, targetY) {
                this.x = x;
                this.y = canvas.height;
                this.targetY = targetY;
                this.velocity = {
                    x: (Math.random() - 0.5) * 2,
                    y: -Math.random() * 8 - 12 // Tốc độ bắn lên
                };
                this.exploded = false;
                this.particles = [];
                this.trail = [];
                this.hue = Math.random() * 360;
            }

            update() {
                if (!this.exploded) {
                    // Pháo đang bay lên
                    this.trail.push({ x: this.x, y: this.y, alpha: 1 });
                    if (this.trail.length > 10) this.trail.shift();
                    
                    this.velocity.y += 0.15; // Trọng lực khi bay lên
                    this.x += this.velocity.x;
                    this.y += this.velocity.y;
                    
                    // Kiểm tra đến đích hoặc bắt đầu rơi
                    if (this.y <= this.targetY || this.velocity.y >= 0) {
                        this.explode();
                    }
                } else {
                    // Cập nhật các hạt nổ
                    this.particles.forEach((particle, index) => {
                        particle.update();
                        if (particle.alpha <= 0) {
                            this.particles.splice(index, 1);
                        }
                    });
                }
                
                // Cập nhật vệt khói
                this.trail.forEach(t => t.alpha -= 0.1);
            }

            explode() {
                this.exploded = true;
                const particleCount = 100 + Math.random() * 100; // 100-200 hạt
                const angleStep = (Math.PI * 2) / particleCount;
                
                for (let i = 0; i < particleCount; i++) {
                    const angle = angleStep * i;
                    const speed = Math.random() * 6 + 2; // Tốc độ phát tán
                    const velocity = {
                        x: Math.cos(angle) * speed,
                        y: Math.sin(angle) * speed
                    };
                    
                    // Tạo màu sắc gradient
                    const hueVariation = this.hue + (Math.random() * 60 - 30);
                    const color = `hsl(${hueVariation}, 100%, ${60 + Math.random() * 20}%)`;
                    
                    this.particles.push(new Particle(this.x, this.y, color, velocity));
                }
            }

            draw() {
                if (!this.exploded) {
                    // Vẽ vệt pháo bay lên
                    this.trail.forEach((point, index) => {
                        ctx.save();
                        ctx.globalAlpha = point.alpha;
                        ctx.fillStyle = `hsl(${this.hue}, 100%, 60%)`;
                        const size = 3 * (index / this.trail.length);
                        ctx.beginPath();
                        ctx.arc(point.x, point.y, size, 0, Math.PI * 2);
                        ctx.fill();
                        ctx.restore();
                    });
                    
                    // Vẽ quả pháo
                    ctx.save();
                    ctx.fillStyle = `hsl(${this.hue}, 100%, 70%)`;
                    ctx.beginPath();
                    ctx.arc(this.x, this.y, 4, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                } else {
                    // Vẽ các hạt nổ
                    this.particles.forEach(particle => particle.draw());
                }
            }

            isDone() {
                return this.exploded && this.particles.length === 0;
            }
        }

        // ===== TEXT ANIMATION =====
        const texts = ['Happy New Year', '2026'];
        const textColors = [
            'rgba(255, 255, 255, 0.9)',
            'rgba(255, 223, 0, 0.9)',
            'rgba(255, 182, 193, 0.9)',
            'rgba(173, 216, 230, 0.9)'
        ];

        function createTextEffect() {
            const textEl = document.createElement('div');
            textEl.className = 'text-effect';
            textEl.textContent = texts[Math.floor(Math.random() * texts.length)];
            textEl.style.color = textColors[Math.floor(Math.random() * textColors.length)];
            
            // Vị trí ngẫu nhiên trên màn hình (tránh mép quá)
            const left = 15 + Math.random() * 70; // 15-85% màn hình
            const top = 20 + Math.random() * 60;  // 20-80% màn hình
            textEl.style.left = left + '%';
            textEl.style.top = top + '%';
            
            document.body.appendChild(textEl);

            // Animation: zoom in cực mạnh từ xa lao tới
            let scale = 0.05;
            let opacity = 0;
            const duration = 1650; // 1.65 giây
            const startTime = Date.now();

            function animate() {
                const elapsed = Date.now() - startTime;
                const progress = Math.min(elapsed / duration, 1);

                if (progress < 0.35) {
                    // Zoom in cực mạnh và fade in nhanh (35% đầu)
                    const zoomProgress = progress / 0.35;
                    scale = 0.05 + (2.0 - 0.05) * zoomProgress; // Zoom tới 2.0
                    opacity = zoomProgress;
                } else {
                    // Fade out nhanh (65% sau)
                    scale = 2.0;
                    const fadeProgress = (progress - 0.35) / 0.65;
                    opacity = 1 - fadeProgress;
                }

                textEl.style.transform = `scale(${scale})`;
                textEl.style.opacity = opacity;

                if (progress < 1) {
                    requestAnimationFrame(animate);
                } else {
                    textEl.remove();
                }
            }

            animate();
        }

        // Tạo nhiều text liên tục với tần suất cao
        let textInterval;
        
        function startTextEffects() {
            textInterval = setInterval(() => {
                // Tạo 2-3 text mỗi lần
                const count = Math.random() > 0.3 ? 3 : 2;
                for (let i = 0; i < count; i++) {
                    setTimeout(() => createTextEffect(), i * 100);
                }
            }, 450);
        }

        // ===== MAIN ANIMATION LOOP =====
        const fireworks = [];
        let animationStarted = false;

        function startFireworks() {
            if (!animationStarted) {
                animationStarted = true;
                // Bắt đầu tạo text effects
                startTextEffects();
            }
        }

        function animate() {
            // Làm mờ canvas (tạo vệt)
            ctx.fillStyle = 'rgba(0, 0, 0, 0.15)';
            ctx.fillRect(0, 0, canvas.width, canvas.height);

            // Chỉ bắn pháo hoa khi đã unlock
            if (isUnlocked && Math.random() < 0.08) {
                const x = Math.random() * canvas.width;
                const targetY = canvas.height * 0.2 + Math.random() * canvas.height * 0.3;
                fireworks.push(new Firework(x, targetY));
            }

            // Cập nhật và vẽ pháo hoa
            fireworks.forEach((firework, index) => {
                firework.update();
                firework.draw();
                
                if (firework.isDone()) {
                    fireworks.splice(index, 1);
                }
            });

            requestAnimationFrame(animate);
        }

        // ===== RESIZE HANDLER =====
        window.addEventListener('resize', () => {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        });

        // Start animation
        animate();
    </script>
</body>
</html>
